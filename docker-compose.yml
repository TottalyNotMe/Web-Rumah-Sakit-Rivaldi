version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: ihis_db
    environment:
      POSTGRES_USER: ihis_user
      POSTGRES_PASSWORD: ihis_password
      POSTGRES_DB: ihis
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ihis_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  pgdata:
